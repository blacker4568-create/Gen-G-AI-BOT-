<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Signal v10.1 Pro Master</title>
    <style>
        body {
            background-color: #131722;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 6px;
            text-align: center;
        }
        .header {
            background: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            color: #00f2fe;
            font-weight: bold;
            font-size: 14px;
            text-align: left;
            margin: 0;
        }
        .badge {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid #22c55e;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        .tv-container {
            background: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 6px;
            padding: 4px;
            margin-bottom: 6px;
            height: 400px;
        }
        .control-panel {
            background: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 6px;
            padding: 10px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 4px;
            padding: 6px 10px;
            margin-bottom: 8px;
            font-size: 11px;
            color: #848e9c;
        }
        .stats-bar span {
            color: #fff;
            font-weight: bold;
        }
        .btn-generator {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0b0e14;
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-generator:active {
            opacity: 0.8;
        }
        #signalResult {
            margin-top: 8px;
            padding: 10px;
            border-radius: 6px;
            background: #131722;
            border: 1px solid #2a2e39;
            font-size: 13px;
            font-weight: bold;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 class="title">VECTOR SIGNAL v10.1</h2>
            <div style="font-size: 10px; color: #848e9c; text-align: left;">TradingView Pro + Audio Alerts</div>
        </div>
        <div class="badge">Master Active</div>
    </div>

    <!-- Official Full TradingView Advanced Chart Widget (A to Z Markets & Tools) -->
    <div class="tv-container">
        <div class="tradingview-widget-container" style="height:100%;width:100%;">
            <div class="tradingview-widget-container__widget" style="height:100%;width:100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
            {
                "autosize": true,
                "symbol": "FX:EURUSD",
                "interval": "1",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "calendar": false,
                "support_host": "https://www.tradingview.com"
            }
            </script>
        </div>
    </div>

    <!-- Control Panel with Stats and Generator -->
    <div class="control-panel">
        <div class="stats-bar">
            <div>Session Signals: <span id="totalSignals">0</span></div>
            <div>Target: <span style="color:#22c55e;">$1 ➔ $40 Pro</span></div>
            <div>Filter: <span style="color:#f39c12;">Strict Extreme</span></div>
        </div>
        <p style="color: #848e9c; font-size: 10px; margin: 0 0 8px 0; text-align: left;">Strict Filter: CALL [80-100] | PUT [0-20]</p>
        <button class="btn-generator" onclick="generateMasterSignal()">GENERATE ELITE TRADING SIGNAL</button>
        <div id="signalResult">Connecting to live market matrices...</div>
    </div>

    <script>
        let signalCount = 0;

        // Audio Beep generator using Web Audio API (no external file needed)
        function playBeep(isSuccess) {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = isSuccess ? "sine" : "triangle";
                osc.frequency.setValueAtTime(isSuccess ? 880 : 300, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + (isSuccess ? 0.2 : 0.4));
            } catch(e) {}
        }

        function generateMasterSignal() {
            signalCount++;
            document.getElementById("totalSignals").innerText = signalCount;

            const box = document.getElementById("signalResult");
            box.style.display = "block";
            box.style.color = "#f39c12";
            box.innerHTML = "Scanning active TradingView order book & momentum...";

            setTimeout(() => {
                let simulatedRsi = Math.floor(Math.random() * 101);
                let message = "";

                if (simulatedRsi >= 80 && simulatedRsi <= 100) {
                    playBeep(true);
                    message = `🟢 STRONG CALL (UP) [RSI: ${simulatedRsi}]<br><span style="font-size:11px; color:#22c55e;">➔ Extreme Oversold Reversal. Execute 1M Buy Trade!</span>`;
                    box.style.color = "#22c55e";
                } else if (simulatedRsi >= 0 && simulatedRsi <= 20) {
                    playBeep(true);
                    message = `🔴 STRONG PUT (DOWN) [RSI: ${simulatedRsi}]<br><span style="font-size:11px; color:#ef4444;">➔ Extreme Overbought Reversal. Execute 1M Sell Trade!</span>`;
                    box.style.color = "#ef4444";
                } else {
                    playBeep(false);
                    message = `⚠️ SIGNAL BLOCKED [RSI: ${simulatedRsi}]<br><span style="font-size:11px; color:#f39c12;">➔ Mid-range zone. Avoid trading to protect capital!</span>`;
                    box.style.color = "#f39c12";
                }
                box.innerHTML = message;
            }, 700);
        }
    </script>
</body>
</html>
