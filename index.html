<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Signal v6.0 Ultimate Engine</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        .header {
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 {
            color: #00f2fe;
            margin: 0;
            font-size: 18px;
            text-align: left;
        }
        .badge {
            background: #1e222d;
            border: 1px solid #2a2e39;
            color: #22c55e;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .card {
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        canvas {
            background: #0b0e14;
            border: 1px solid #2a2e39;
            border-radius: 6px;
            width: 100%;
            height: 200px;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 13px;
            color: #848e9c;
        }
        .stats-row span {
            color: #fff;
            font-weight: bold;
        }
        button {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0b0e14;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active {
            opacity: 0.8;
        }
        #signalBox {
            font-size: 15px;
            font-weight: bold;
            margin-top: 12px;
            padding: 12px;
            border-radius: 6px;
            background: #1e222d;
            border: 1px solid #2a2e39;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>VECTOR SIGNAL<br><span style="font-size: 14px; color: #fff;">v6.0 ULTIMATE</span></h2>
        <div class="badge">EUR/USD 1m<br>Custom Engine Live</div>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:13px; color:#848e9c;">
            <span>Asset: EUR/USD</span>
            <span id="livePrice" style="color:#00f2fe; font-weight:bold;">1.12045</span>
        </div>
        <canvas id="chartCanvas"></canvas>
        <div class="stats-row">
            <div>RSI (14): <span id="rsiVal">50.0</span></div>
            <div>Trend: <span id="trendVal" style="color:#f39c12;">Neutral</span></div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin:0 0 5px 0; font-size:15px; color:#fff;">STRICT ELITE FILTER</h3>
        <p style="color:#848e9c; font-size:11px; margin:0 0 10px 0;">CALL strictly 80-100 | PUT strictly 0-20 (Mid Blocked)</p>
        <button onclick="runEliteAnalysis()">GENERATE HIGH-ACCURACY SIGNAL</button>
        <div id="signalBox">Scanning market depth...</div>
    </div>

    <script>
        const canvas = document.getElementById("chartCanvas");
        const ctx = canvas.getContext("2d");
        
        // Resize canvas for sharp rendering
        canvas.width = canvas.parentElement.clientWidth - 30;
        canvas.height = 200;

        let price = 1.12045;
        let prices = [];
        for(let i=0; i<30; i++) {
            price += (Math.random() - 0.48) * 0.0003;
            prices.push(price);
        }

        function drawChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid lines
            ctx.strokeStyle = "#1e222d";
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.height; i+=40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw price line
            ctx.strokeStyle = "#00f2fe";
            ctx.lineWidth = 2;
            ctx.beginPath();
            let step = canvas.width / prices.length;
            
            prices.forEach((p, index) => {
                let x = index * step;
                let minP = Math.min(...prices);
                let maxP = Math.max(...prices);
                let y = canvas.height - ((p - minP) / (maxP - minP || 1)) * (canvas.height - 40) - 20;
                
                if(index === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
        }

        setInterval(() => {
            price += (Math.random() - 0.49) * 0.0004;
            prices.shift();
            prices.push(price);
            document.getElementById("livePrice").innerText = price.toFixed(5);
            
            // Simulated live RSI matching extreme logic
            let currentRsi = (price * 100000) % 100;
            document.getElementById("rsiVal").innerText = currentRsi.toFixed(1);
            
            let trend = document.getElementById("trendVal");
            if(currentRsi >= 80) {
                trend.innerText = "Overbought (High Sell Risk)";
                trend.style.color = "#ef4444";
            } else if(currentRsi <= 20) {
                trend.innerText = "Oversold (High Buy Risk)";
                trend.style.color = "#22c55e";
            } else {
                trend.innerText = "Consolidation / Safe Zone";
                trend.style.color = "#f39c12";
            }

            drawChart();
        }, 1500);

        function runEliteAnalysis() {
            const box = document.getElementById("signalBox");
            box.style.display = "block";
            box.style.color = "#f39c12";
            box.innerHTML = "Analyzing strict 1-minute order flow...";

            setTimeout(() => {
                const rsi = parseFloat(document.getElementById("rsiVal").innerText);
                let msg = "";
                let bgCol = "#1e222d";

                if (rsi >= 80 && rsi <= 100) {
                    msg = `🟢 STRONG CALL (UP) [RSI: ${rsi}] - Elite Bullish Momentum`;
                    box.style.color = "#22c55e";
                } else if (rsi >= 0 && rsi <= 20) {
                    msg = `🔴 STRONG PUT (DOWN) [RSI: ${rsi}] - Elite Bearish Momentum`;
                    box.style.color = "#ef4444";
                } else {
                    msg = `⚠️ SIGNAL BLOCKED [RSI: ${rsi}] - Mid-range trap avoided!`;
                    box.style.color = "#f39c12";
                }
                box.innerHTML = msg;
            }, 800);
        }

        drawChart();
    </script>
</body>
</html>
