<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Signal v8.1 Pro Master</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 8px;
            text-align: center;
        }
        .top-bar {
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .asset-title {
            color: #00f2fe;
            font-weight: bold;
            font-size: 15px;
            text-align: left;
        }
        .payout-badge {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid #22c55e;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .chart-box {
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
        }
        canvas {
            background: #0b0e14;
            border: 1px solid #1e222d;
            border-radius: 6px;
            width: 100%;
            height: 180px;
        }
        .metrics-grid {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: #848e9c;
        }
        .metrics-grid span {
            color: #fff;
            font-weight: bold;
        }
        .action-panel {
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 8px;
            padding: 12px;
        }
        .btn-scan {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0b0e14;
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
        }
        #signalOutput {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            background: #1e222d;
            border: 1px solid #2a2e39;
            font-size: 13px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <div class="asset-title">EUR/USD (OTC)</div>
            <div style="font-size:11px; color:#848e9c; text-align:left;">Trend-Guard Engine v8.1</div>
        </div>
        <div class="payout-badge">Payout: 92%</div>
    </div>

    <div class="chart-box">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:12px;">
            <span style="color:#848e9c;">Live Price Action</span>
            <span id="priceDisplay" style="color:#00f2fe; font-weight:bold;">1.11686</span>
        </div>
        <canvas id="quotexCanvas"></canvas>
        <div class="metrics-grid">
            <div>RSI (14): <span id="rsiVal">50.0</span></div>
            <div>Trend Filter: <span id="trendStatus" style="color:#f39c12;">Analyzing...</span></div>
        </div>
    </div>

    <div class="action-panel">
        <h3 style="margin:0 0 4px 0; font-size:14px; color:#fff;">QUOTEX VIP TREND MATRIX</h3>
        <p style="color:#848e9c; font-size:10px; margin:0 0 10px 0;">Strict Trend Lock: No Counter-Trend Signals</p>
        
        <button class="btn-scan" onclick="generateProSignal()">SCAN MARKET WITH TREND GUARD</button>
        
        <div id="signalOutput">Checking trend direction...</div>
    </div>

    <script>
        const canvas = document.getElementById("quotexCanvas");
        const ctx = canvas.getContext("2d");
        
        canvas.width = canvas.parentElement.clientWidth - 20;
        canvas.height = 180;

        let prices = [1.11720, 1.11710, 1.11700, 1.11690, 1.11680, 1.11675, 1.11686];
        let currentRsi = 50.0;
        let marketTrend = "SIDEWAYS";

        function calcRSI(data) {
            let gains = 0, losses = 0;
            for (let i = 1; i < data.length; i++) {
                let diff = data[i] - data[i - 1];
                if (diff >= 0) gains += diff;
                else losses -= diff;
            }
            if (losses === 0) return 95.0;
            let rs = gains / losses;
            let rsi = 100 - (100 / (1 + rs));
            return Math.min(100, Math.max(0, rsi));
        }

        function updateTrend() {
            let recentDiff = prices[prices.length - 1] - prices[prices.length - 4];
            if (recentDiff > 0.00010) {
                marketTrend = "BULLISH (UP)";
            } else if (recentDiff < -0.00010) {
                marketTrend = "BEARISH (DOWN)";
            } else {
                marketTrend = "SIDEWAYS";
            }
        }

        function drawQuotexChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "#161a25";
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.height; i+=30) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            ctx.strokeStyle = marketTrend === "BEARISH (DOWN)" ? "#ef4444" : "#22c55e";
            ctx.lineWidth = 2;
            ctx.beginPath();
            let step = canvas.width / (prices.length - 1 || 1);
            let minP = Math.min(...prices);
            let maxP = Math.max(...prices);
            let range = maxP - minP || 0.0001;

            prices.forEach((p, index) => {
                let x = index * step;
                let y = canvas.height - ((p - minP) / range) * (canvas.height - 30) - 15;
                if(index === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
        }

        setInterval(() => {
            let last = prices[prices.length - 1];
            let next = last + (Math.random() - 0.51) * 0.00035; // Slight downward bias for realism matching current market
            prices.shift();
            prices.push(next);

            document.getElementById("priceDisplay").innerText = next.toFixed(5);
            currentRsi = calcRSI(prices);
            document.getElementById("rsiVal").innerText = currentRsi.toFixed(1);

            updateTrend();
            let tElem = document.getElementById("trendStatus");
            tElem.innerText = marketTrend;
            tElem.style.color = marketTrend === "BEARISH (DOWN)" ? "#ef4444" : (marketTrend === "BULLISH (UP)" ? "#22c55e" : "#f39c12");

            drawQuotexChart();
        }, 1200);

        function generateProSignal() {
            const out = document.getElementById("signalOutput");
            out.style.display = "block";
            out.style.color = "#f39c12";
            out.innerHTML = "Running Trend-Guard Validation...";

            setTimeout(() => {
                let text = "";
                // STRICT TREND LOCK: Never give CALL in Bearish trend or PUT in Bullish trend
                if (marketTrend === "BULLISH (UP)" && currentRsi >= 75) {
                    text = `🟢 STRONG CALL (UP) [RSI: ${currentRsi.toFixed(1)}] -> Trend Confirmed Bullish! Take 1M Trade.`;
                    out.style.color = "#22c55e";
                } else if (marketTrend === "BEARISH (DOWN)" && currentRsi <= 25) {
                    text = `🔴 STRONG PUT (DOWN) [RSI: ${currentRsi.toFixed(1)}] -> Trend Confirmed Bearish! Take 1M Trade.`;
                    out.style.color = "#ef4444";
                } else {
                    text = `⚠️ SIGNAL BLOCKED [Trend: ${marketTrend} | RSI: ${currentRsi.toFixed(1)}] -> Counter-trend prevented!`;
                    out.style.color = "#f39c12";
                }
                out.innerHTML = text;
            }, 700);
        }

        drawQuotexChart();
    </script>
</body>
</html>
