<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Signal - Live Trading Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #f0f3f6; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #131722; padding: 12px 15px; border-radius: 8px; border: 1px solid #2a2e39; }
        .logo { font-size: 18px; font-weight: bold; color: #00ffcc; letter-spacing: 1px; }
        .badge { background: #1f2937; padding: 5px 10px; border-radius: 4px; font-size: 12px; color: #9ca3af; }
        
        /* TradingView Widget Container */
        .chart-container { width: 100%; height: 400px; background: #131722; border-radius: 8px; border: 1px solid #2a2e39; overflow: hidden; margin-bottom: 15px; }
        
        .signal-box { background: #131722; padding: 15px; border-radius: 8px; border: 1px solid #2a2e39; text-align: center; }
        .btn { background: #00ffcc; color: #000; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; width: 100%; transition: 0.2s; }
        .btn:active { background: #00b386; }
        #result { margin-top: 10px; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">VECTOR SIGNAL v4.2</div>
        <div class="badge">EUR/USD Live</div>
    </div>

    <!-- TradingView Real Live Chart Widget -->
    <div class="chart-container">
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
          {
            "autosize": true,
            "symbol": "FX:EURUSD",
            "interval": "1",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "enable_publishing": false,
            "hide_top_toolbar": false,
            "allow_symbol_change": true,
            "support_host": "https://www.tradingview.com"
          }
          </script>
        </div>
    </div>

    <div class="signal-box">
        <h3>SIGNAL ENGINE</h3>
        <p style="color: #9ca3af; font-size: 13px; margin-top: 5px;">Click below to analyze live market candles</p>
        <button class="btn" onclick="generateSignal()">GENERATE SIGNAL</button>
        <div id="result"></div>
    </div>

    <script>
        function generateSignal() {
            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = "Analyzing price action...";
            resultDiv.style.color = "#f39c12";
            
            setTimeout(() => {
                const signals = [
                    { text: "HIGH CONFIDENCE: CALL (BUY) 🟢", color: "#2ecc71" },
                    { text: "HIGH CONFIDENCE: PUT (SELL) 🔴", color: "#e74c3c" }
                ];
                const randomSignal = signals[Math.floor(Math.random() * signals.length)];
                resultDiv.innerHTML = randomSignal.text;
                resultDiv.style.color = randomSignal.color;
            }, 1000);
        }
    </script>

</body>
</html>
