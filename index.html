
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Signal v4.3 Pro</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .header {
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 {
            color: #00f2fe;
            margin: 0;
            font-size: 18px;
            text-align: left;
        }
        .badge {
            background: #1e222d;
            border: 1px solid #2a2e39;
            color: #848e9c;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        .chart-container {
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 8px;
            height: 300px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .analysis-container {
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }
        .analysis-container h3 {
            margin: 0 0 10px 0;
            font-size: 15px;
            letter-spacing: 1px;
            color: #00f2fe;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>VECTOR SIGNAL<br><span style="font-size: 16px; color: #fff;">v4.3</span></h2>
        <div class="badge">EUR/USD Pro<br>Filter</div>
    </div>

    <!-- TradingView Chart Widget BEGIN -->
    <div class="chart-container">
        <div class="tradingview-widget-container" style="height:100%;width:100%">
            <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
            {
                "autosize": true,
                "symbol": "FX:EURUSD",
                "interval": "1",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "allow_symbol_change": false,
                "calendar": false,
                "support_host": "https://www.tradingview.com"
            }
            </script>
        </div>
    </div>
    <!-- TradingView Chart Widget END -->

    <!-- TradingView Technical Analysis Widget BEGIN -->
    <div class="analysis-container">
        <h3>REAL-TIME MARKET ANALYSIS ENGINE</h3>
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
            {
                "interval": "1m",
                "width": "100%",
                "isTransparent": true,
                "symbol": "FX:EURUSD",
                "showIntervalTabs": true,
                "locale": "en",
                "colorTheme": "dark"
            }
            </script>
        </div>
    </div>
    <!-- TradingView Technical Analysis Widget END -->

</body>
</html>
